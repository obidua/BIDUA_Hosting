# Ruff configuration for Python linting

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B904", "W191"]
exclude = [".git", ".venv", "venv", "__pycache__", "alembic/versions"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[format]
quote-style = "double"
indent-style = "space"
target-version = "py312"
